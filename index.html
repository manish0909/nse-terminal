<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE Stock Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --bg1:#111118;
  --bg2:#16161f;
  --bg3:#1c1c28;
  --border:#2a2a3a;
  --border2:#353550;
  --text:#e8e8f0;
  --text2:#8888aa;
  --text3:#55556a;
  --green:#00e676;
  --green2:#00c853;
  --greendim:rgba(0,230,118,0.08);
  --red:#ff5252;
  --red2:#d50000;
  --reddim:rgba(255,82,82,0.08);
  --amber:#ffab40;
  --amberdim:rgba(255,171,64,0.08);
  --blue:#448aff;
  --bluedim:rgba(68,138,255,0.08);
  --accent:#7c4dff;
  --font:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow-x:hidden}

/* GRID NOISE BACKGROUND */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(ellipse 80% 50% at 20% 20%, rgba(124,77,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(68,138,255,0.05) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

/* HEADER */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,15,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px;white-space:nowrap}
.logo span{color:var(--accent)}
.search-wrap{display:flex;gap:8px;flex:1;max-width:480px}
.search-wrap input{
  flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 14px;outline:none;
  transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap button{
  background:var(--accent);border:none;border-radius:8px;color:#fff;
  font-family:var(--font);font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;
  transition:opacity .2s;white-space:nowrap;
}
.search-wrap button:hover{opacity:.85}
.quick-stocks{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.quick-stocks::-webkit-scrollbar{display:none}
.qs{
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  color:var(--text2);font-family:var(--mono);font-size:11px;font-weight:500;
  padding:5px 10px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.qs:hover,.qs.active{border-color:var(--accent);color:var(--accent);background:rgba(124,77,255,0.1)}

/* INDEX STRIP */
.strip{
  background:var(--bg1);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.si{display:flex;align-items:center;gap:8px;white-space:nowrap}
.si-name{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
.si-price{font-family:var(--mono);font-size:13px;font-weight:500}
.si-chg{font-family:var(--mono);font-size:11px;font-weight:500}
.up{color:var(--green)}.down{color:var(--red)}

/* MAIN */
.main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 24px 60px}

/* STATE CARDS */
.empty-state{
  text-align:center;padding:80px 20px;
}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:22px;font-weight:600;margin-bottom:8px}
.empty-sub{color:var(--text2);font-size:14px}

.loading-state{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px;color:var(--text2)}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.err-card{background:var(--reddim);border:1px solid var(--red);border-radius:12px;padding:16px 20px;color:var(--red);font-size:13px}

/* STOCK LAYOUT */
.stock-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── TABLET (≤900px) ─────────────────────────────────── */
@media(max-width:900px){
  .header{padding:10px 16px;gap:10px}
  .search-wrap{max-width:100%;flex:1 1 auto}
  .quick-stocks{display:none} /* hidden on tablet, shown below strip */
  .stock-grid{grid-template-columns:1fr}
  .stock-grid>div:last-child{order:-1} /* rec card on top */
  .main{padding:16px 16px 40px}
  .rec-card{flex-direction:row;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .rec-header{width:100%}
  .targets{grid-template-columns:repeat(4,1fr)}
  .rr-row{width:100%}
  .sig-detail{display:none}
}

/* ── MOBILE (≤600px) ─────────────────────────────────── */
@media(max-width:600px){
  .header{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .logo{font-size:15px}
  .search-wrap{flex:1 1 calc(100% - 0px);max-width:100%}
  .search-wrap input{font-size:12px;padding:8px 12px}
  .search-wrap button{padding:8px 14px;font-size:12px}
  .quick-stocks{display:none}
  .strip{padding:7px 12px;gap:14px}
  .si-price{font-size:12px}
  .si-name{font-size:10px}
  .si-chg{font-size:10px}
  .main{padding:12px 12px 40px}
  .stock-grid{gap:12px}
  .stock-grid>div:last-child{order:-1}
  .hero-card{padding:16px}
  .stock-name{font-size:17px}
  .stock-price{font-size:26px}
  .hero-stats{gap:12px}
  .stat-v{font-size:12px}
  .rec-card{padding:16px;gap:12px;flex-direction:column}
  .rec-badge{font-size:16px;padding:7px 14px}
  .targets{grid-template-columns:1fr 1fr;gap:8px}
  .target-price{font-size:15px}
  .signals-section{padding:14px 14px}
  .signal-row{gap:6px}
  .sig-name{min-width:58px;font-size:11px}
  .sig-tag{min-width:70px;font-size:10px}
  .sig-detail{display:none}
  .chart-section{padding:14px 12px}
  .chart-controls{gap:6px}
  .rbtn{padding:4px 7px;font-size:10px}
  .obtn{padding:4px 7px;font-size:10px}
  .metrics-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .metric-box{padding:10px 12px}
  .metric-v{font-size:13px}
  .analysis-card{padding:14px}
  .analysis-text{font-size:12px}
  .empty-state{padding:50px 16px}
  .empty-title{font-size:18px}
  /* Tooltip: always show above finger on mobile */
  #tooltip{font-size:10px;min-width:130px}
}

/* ── QUICK STOCKS: show as scrollable row below strip on mobile/tab ── */
.qs-strip{
  display:none;
  background:var(--bg1);border-bottom:1px solid var(--border);
  padding:8px 12px;overflow-x:auto;gap:6px;scrollbar-width:none;
}
.qs-strip::-webkit-scrollbar{display:none}
@media(max-width:900px){.qs-strip{display:flex}}

/* HERO CARD */
.hero-card{
  background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:22px 24px;
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px;
}
.hero-left{flex:1;min-width:180px}
.stock-name{font-size:20px;font-weight:700;letter-spacing:-.3px}
.stock-meta{color:var(--text2);font-size:12px;margin-top:3px;font-family:var(--mono)}
.stock-price{font-size:32px;font-weight:700;font-family:var(--mono);margin-top:10px;letter-spacing:-1px}
.stock-chg{font-size:14px;font-family:var(--mono);font-weight:500;margin-top:3px}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat-v{font-size:13px;font-family:var(--mono);font-weight:500}

/* RECOMMENDATION CARD */
.rec-card{
  background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:22px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.rec-header{display:flex;align-items:center;justify-content:space-between}
.rec-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.rec-badge{
  font-size:20px;font-weight:700;letter-spacing:.5px;padding:8px 18px;border-radius:10px;
  font-family:var(--mono);
}
.rec-badge.STRONG-BUY{background:rgba(0,200,83,0.15);color:#00c853;border:1.5px solid #00c853}
.rec-badge.BUY{background:var(--greendim);color:var(--green);border:1.5px solid var(--green)}
.rec-badge.HOLD{background:var(--amberdim);color:var(--amber);border:1.5px solid var(--amber)}
.rec-badge.SELL{background:var(--reddim);color:var(--red);border:1.5px solid var(--red)}
.rec-badge.STRONG-SELL{background:rgba(213,0,0,0.15);color:#ff1744;border:1.5px solid #ff1744}

/* TARGETS */
.targets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.target-box.entry{border-color:var(--blue);background:var(--bluedim)}
.target-box.sl{border-color:var(--red);background:var(--reddim)}
.target-box.t1{border-color:var(--green);background:var(--greendim)}
.target-box.t2{border-color:rgba(0,200,83,.6);background:rgba(0,200,83,0.05)}
.target-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.target-price{font-size:17px;font-weight:700;font-family:var(--mono)}
.target-pct{font-size:11px;font-family:var(--mono);margin-top:1px}
.target-box.entry .target-price{color:var(--blue)}
.target-box.sl .target-price{color:var(--red)}
.target-box.t1 .target-price{color:var(--green)}
.target-box.t2 .target-price{color:#00c853}

/* RISK/REWARD */
.rr-row{background:var(--bg2);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.rr-label{font-size:11px;color:var(--text2);font-weight:500}
.rr-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--amber)}

/* SIGNAL BARS */
.signals-section{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.section-title{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:14px}
.signal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.signal-row:last-child{border-bottom:none}
.sig-name{font-size:12px;font-weight:600;min-width:80px;color:var(--text2)}
.sig-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.sig-bar{height:100%;border-radius:3px;transition:width .6s ease}
.sig-bar.bull{background:var(--green)}
.sig-bar.bear{background:var(--red)}
.sig-bar.neutral{background:var(--amber)}
.sig-tag{font-size:11px;font-weight:600;font-family:var(--mono);min-width:90px;text-align:right}
.sig-detail{font-size:10px;color:var(--text3);font-family:var(--mono);min-width:140px;text-align:right}

/* CHART */
.chart-section{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-top:20px}
.chart-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.range-btns{display:flex;gap:4px}
.rbtn{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--text2);font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer;
  transition:all .15s;
}
.rbtn.on,.rbtn:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent)}
.overlay-btns{display:flex;gap:6px}
.obtn{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--text3);font-size:11px;padding:4px 9px;cursor:pointer;transition:all .15s;
}
.obtn.on{border-color:var(--border2);color:var(--text)}
canvas#mainChart{width:100%;display:block;border-radius:8px;background:transparent}

/* KEY METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:20px}
.metric-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.metric-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px}
.metric-v{font-size:15px;font-family:var(--mono);font-weight:600}

/* ANALYSIS TEXT */
.analysis-card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-top:20px}
.analysis-text{font-size:13px;line-height:1.75;color:var(--text2)}
.analysis-text strong{color:var(--text);font-weight:600}

/* TOOLTIP */
#tooltip{
  position:fixed;display:none;background:var(--bg3);border:1px solid var(--border2);
  border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:11px;
  pointer-events:none;z-index:999;min-width:160px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.tt-date{color:var(--text2);margin-bottom:6px;font-size:10px}
.tt-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:2px}
.tt-lbl{color:var(--text3)}.tt-val{color:var(--text);font-weight:500}
</style>
</head>
<body>

<div class="header">
  <div class="logo">NSE<span>Advisor</span></div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Enter symbol… e.g. RELIANCE, TCS" 
      onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Analyse</button>
  </div>
  <div class="quick-stocks" id="quickStocks"></div>
</div>

<div class="strip" id="strip">
  <div class="si"><span class="si-name">Loading indices…</span></div>
</div>
<div class="qs-strip" id="qsStrip"></div>

<div class="main" id="main">
  <div class="empty-state">
    <div class="empty-icon">📈</div>
    <div class="empty-title">Search any NSE stock</div>
    <div class="empty-sub">Get buy/sell recommendations, price targets, and technical analysis</div>
  </div>
</div>

<div id="tooltip"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const STOCKS = [
  {l:'RELIANCE',s:'RELIANCE.NS'},{l:'TCS',s:'TCS.NS'},{l:'HDFCBANK',s:'HDFCBANK.NS'},
  {l:'INFY',s:'INFY.NS'},{l:'ICICIBANK',s:'ICICIBANK.NS'},{l:'SBIN',s:'SBIN.NS'},
  {l:'WIPRO',s:'WIPRO.NS'},{l:'BAJFINANCE',s:'BAJFINANCE.NS'},{l:'ADANIENT',s:'ADANIENT.NS'},
  {l:'TATAMOTORS',s:'TATAMOTORS.NS'},{l:'MARUTI',s:'MARUTI.NS'},{l:'AXISBANK',s:'AXISBANK.NS'},
  {l:'SUNPHARMA',s:'SUNPHARMA.NS'},{l:'LTIM',s:'LTIM.NS'},
];
const INDICES = [
  {l:'NIFTY 50',s:'^NSEI'},{l:'BANK NIFTY',s:'^NSEBANK'},
  {l:'SENSEX',s:'^BSESN'},{l:'NIFTY IT',s:'^CNXIT'},
];
const S = { sym: null, range: '6mo', showEMA: true, showBB: false, hist: null, ind: null };

// ── FETCH ────────────────────────────────────────────────────────────────────
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
}
async function tryGet(url) {
  const r = await withTimeout(fetch(url,{mode:'cors'}), 9000);
  if (!r.ok) throw new Error('HTTP '+r.status);
  const t = await r.text();
  if (!t.trim()) throw new Error('empty');
  const j = JSON.parse(t);
  if (j && typeof j.contents === 'string') return JSON.parse(j.contents);
  return j;
}
async function fetchData(url) {
  const proxies = [
    () => tryGet(url),
    () => tryGet(`https://corsproxy.io/?${encodeURIComponent(url)}`),
    () => tryGet(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`),
    () => tryGet(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`),
  ];
  for (const fn of proxies) {
    try { return await fn(); } catch(_) {}
  }
  throw new Error('Unable to fetch data. Try again or check connection.');
}

async function getHist(sym, range) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=${range}&includePrePost=false`;
  let d;
  try { d = await fetchData(url); }
  catch(_) {
    const url2 = url.replace('query1','query2');
    d = await fetchData(url2);
  }
  const res = d.chart?.result?.[0];
  if (!res) throw new Error('No data returned');
  const ts = res.timestamp;
  const q = res.indicators.quote[0];
  const ac = res.indicators.adjclose?.[0]?.adjclose;
  const c = ac || q.close;
  const valid = ts.map((_,i) => c[i]!=null && q.open[i]!=null);
  return {
    ts: ts.filter((_,i)=>valid[i]),
    o:  q.open.filter((_,i)=>valid[i]),
    h:  q.high.filter((_,i)=>valid[i]),
    l:  q.low.filter((_,i)=>valid[i]),
    c:  c.filter((_,i)=>valid[i]),
    v:  q.volume.filter((_,i)=>valid[i]),
    meta: res.meta
  };
}

async function getQuote(sym) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=5d`;
  const d = await fetchData(url);
  const r = d.chart.result[0];
  const m = r.meta;
  const c = r.indicators.adjclose?.[0]?.adjclose || r.indicators.quote[0].close;
  const vc = c.filter(v=>v!=null);
  const price = m.regularMarketPrice || vc[vc.length-1];
  const prev = m.chartPreviousClose || m.previousClose || vc[vc.length-2] || price;
  const chg = price - prev;
  return {
    symbol: sym, shortName: m.shortName || sym,
    price, change: chg, changePct: prev?(chg/prev)*100:0,
    volume: m.regularMarketVolume,
    high: m.regularMarketDayHigh, low: m.regularMarketDayLow,
    week52High: m.fiftyTwoWeekHigh, week52Low: m.fiftyTwoWeekLow,
    marketCap: m.marketCap, pe: m.trailingPE,
    exchange: m.exchangeName, prevClose: prev
  };
}

// ── INDICATORS ────────────────────────────────────────────────────────────────
function ema(arr, p) {
  const k=2/(p+1), out=new Array(arr.length).fill(null);
  let s=0,c=0,si=-1;
  for(let i=0;i<arr.length;i++){s+=arr[i];c++;if(c===p){out[i]=s/p;si=i;break;}}
  if(si<0)return out;
  for(let i=si+1;i<arr.length;i++) out[i]=arr[i]*k+out[i-1]*(1-k);
  return out;
}
function rsi(arr, p=14) {
  const out=new Array(arr.length).fill(null);
  if(arr.length<p+1)return out;
  const g=[],l=[];
  for(let i=1;i<arr.length;i++){const d=arr[i]-arr[i-1];g.push(d>0?d:0);l.push(d<0?-d:0);}
  let ag=g.slice(0,p).reduce((a,b)=>a+b,0)/p;
  let al=l.slice(0,p).reduce((a,b)=>a+b,0)/p;
  out[p]=al===0?100:100-(100/(1+ag/al));
  for(let i=p+1;i<arr.length;i++){
    ag=(ag*(p-1)+g[i-1])/p; al=(al*(p-1)+l[i-1])/p;
    out[i]=al===0?100:100-(100/(1+ag/al));
  }
  return out;
}
function macd(arr) {
  const e12=ema(arr,12), e26=ema(arr,26);
  const ml=arr.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null);
  const valid=ml.filter(v=>v!=null);
  const rawSig=ema(valid,9);
  const sl=new Array(arr.length).fill(null);
  let si=0;
  for(let i=0;i<arr.length;i++){if(ml[i]!=null)sl[i]=rawSig[si++]||null;}
  const hist=arr.map((_,i)=>ml[i]!=null&&sl[i]!=null?ml[i]-sl[i]:null);
  return {ml,sl,hist};
}
function bb(arr,p=20,m=2) {
  const u=new Array(arr.length).fill(null),mid=new Array(arr.length).fill(null),lo=new Array(arr.length).fill(null);
  for(let i=p-1;i<arr.length;i++){
    const s=arr.slice(i-p+1,i+1);
    const mn=s.reduce((a,b)=>a+b,0)/p;
    const std=Math.sqrt(s.reduce((a,b)=>a+(b-mn)**2,0)/p);
    u[i]=mn+m*std; mid[i]=mn; lo[i]=mn-m*std;
  }
  return {u,mid,lo};
}
function atr(h,l,c,p=14) {
  const tr=[];
  for(let i=1;i<h.length;i++) tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  const out=new Array(h.length).fill(null);
  if(tr.length<p) return out;
  let avg=tr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  out[p]=avg;
  for(let i=p+1;i<h.length;i++){avg=(avg*(p-1)+tr[i-1])/p; out[i]=avg;}
  return out;
}
function sma(arr,p) {
  const out=new Array(arr.length).fill(null);
  for(let i=p-1;i<arr.length;i++) out[i]=arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p;
  return out;
}
// Support/resistance via pivot highs/lows
function pivots(h,l,c,lookback=10) {
  const highs=[], lows=[];
  for(let i=lookback;i<h.length-lookback;i++){
    const wh=Math.max(...h.slice(i-lookback,i+lookback+1));
    const wl=Math.min(...l.slice(i-lookback,i+lookback+1));
    if(h[i]===wh) highs.push(h[i]);
    if(l[i]===wl) lows.push(l[i]);
  }
  return {highs:highs.slice(-5), lows:lows.slice(-5)};
}

function calcAll(hist) {
  const c=hist.c, h=hist.h, l=hist.l;
  return {
    e20:ema(c,20), e50:ema(c,50), e200:ema(c,200),
    rsiArr:rsi(c,14), macdObj:macd(c), bbObj:bb(c,20,2),
    atrArr:atr(h,l,c,14),
    sma20:sma(c,20), sma50:sma(c,50),
    pvts:pivots(h,l,c,10)
  };
}

// ── RECOMMENDATION ENGINE ──────────────────────────────────────────────────────
function analyse(hist, ind) {
  const n=hist.c.length-1;
  const price=hist.c[n];
  const {e20,e50,e200,rsiArr,macdObj,bbObj,atrArr,pvts}=ind;

  const signals = [];

  // RSI
  const rv=rsiArr[n];
  if(rv!=null){
    let d,lb,detail;
    if(rv<30){d='bull';lb='OVERSOLD';detail=`RSI ${rv.toFixed(1)} — strong bounce zone`;}
    else if(rv<45){d='bull';lb='MILD BULL';detail=`RSI ${rv.toFixed(1)} — momentum building`;}
    else if(rv>70){d='bear';lb='OVERBOUGHT';detail=`RSI ${rv.toFixed(1)} — pullback likely`;}
    else if(rv>55){d='bear';lb='MILD BEAR';detail=`RSI ${rv.toFixed(1)} — weakening`;}
    else{d='neutral';lb='NEUTRAL';detail=`RSI ${rv.toFixed(1)} — neutral zone`;}
    signals.push({n:'RSI',lb,d,detail,pct:rv});
  }

  // MACD
  const mv=macdObj.ml[n],sv=macdObj.sl[n],hv=macdObj.hist[n];
  if(mv!=null&&sv!=null){
    const d=mv>sv?'bull':'bear';
    const cross=hv!=null&&macdObj.hist[n-1]!=null&&Math.sign(hv)!==Math.sign(macdObj.hist[n-1]);
    const lb=d==='bull'?(cross?'BULLISH X-OVER':'BULLISH'):(cross?'BEARISH X-OVER':'BEARISH');
    signals.push({n:'MACD',lb,d,detail:`MACD ${mv.toFixed(2)} / Signal ${sv.toFixed(2)}`,pct:50+(mv-sv)});
  }

  // EMA Trend
  const e20v=e20[n],e50v=e50[n],e200v=e200[n];
  if(e20v&&e50v){
    const ab20=price>e20v, ab50=price>e50v, ab200=e200v?price>e200v:null;
    let d,lb,detail;
    if(ab20&&ab50&&ab200!==false){d='bull';lb='UPTREND';detail=`Price above EMA20/50${e200v?'/200':''}`;}
    else if(!ab20&&!ab50&&ab200!==true){d='bear';lb='DOWNTREND';detail=`Price below EMA20/50${e200v?'/200':''}`;}
    else{d='neutral';lb='MIXED';detail=`Price mixed vs EMAs`;}
    signals.push({n:'EMA',lb,d,detail,pct:ab20&&ab50?75:!ab20&&!ab50?25:50});
  }

  // Bollinger Bands
  const bu=bbObj.u[n],bm=bbObj.mid[n],bl=bbObj.lo[n];
  if(bu){
    let d,lb,detail,pct;
    const pos=(price-bl)/(bu-bl)*100;
    if(price>=bu){d='bear';lb='UPPER BAND';detail='Stretched — mean reversion risk';pct=90;}
    else if(price<=bl){d='bull';lb='LOWER BAND';detail='Compressed — potential bounce';pct=10;}
    else if(pos>60){d='bear';lb='UPPER HALF';detail=`BB position ${pos.toFixed(0)}%`;pct=65;}
    else{d='bull';lb='LOWER HALF';detail=`BB position ${pos.toFixed(0)}%`;pct=35;}
    signals.push({n:'BB',lb,d,detail,pct:pos});
  }

  // Volume trend
  const recentVol=hist.v.slice(-5).reduce((a,b)=>a+b,0)/5;
  const avgVol=hist.v.slice(-20).reduce((a,b)=>a+b,0)/20;
  if(avgVol>0){
    const ratio=recentVol/avgVol;
    const priceUp=hist.c[n]>hist.c[n-5];
    const d=ratio>1.2&&priceUp?'bull':ratio>1.2&&!priceUp?'bear':'neutral';
    const lb=ratio>1.3?'HIGH VOL':ratio<0.7?'LOW VOL':'NORMAL';
    signals.push({n:'VOLUME',lb,d,detail:`${(ratio*100).toFixed(0)}% of 20d avg`,pct:ratio*50});
  }

  const bull=signals.filter(s=>s.d==='bull').length;
  const bear=signals.filter(s=>s.d==='bear').length;
  const total=signals.length;

  let rec,recClass,recScore;
  if(bull>=4){rec='STRONG BUY';recClass='STRONG-BUY';recScore=95;}
  else if(bull>bear&&bull>=3){rec='BUY';recClass='BUY';recScore=70;}
  else if(bear>=4){rec='STRONG SELL';recClass='STRONG-SELL';recScore=5;}
  else if(bear>bull&&bear>=3){rec='SELL';recClass='SELL';recScore=30;}
  else{rec='HOLD';recClass='HOLD';recScore=50;}

  // Price targets using ATR
  const atrVal=atrArr[n]||price*0.02;
  const isBuy=rec.includes('BUY');
  const isSell=rec.includes('SELL');

  // Support/resistance levels
  const resistances=pvts.highs.filter(v=>v>price).sort((a,b)=>a-b);
  const supports=pvts.lows.filter(v=>v<price).sort((a,b)=>b-a);

  let entry=price;
  let sl, t1, t2;

  if(isBuy){
    sl=supports[0]?Math.max(supports[0], price-2*atrVal):price-2*atrVal;
    t1=resistances[0]?Math.min(resistances[0], price+2.5*atrVal):price+2.5*atrVal;
    t2=resistances[1]?Math.min(resistances[1], price+5*atrVal):price+5*atrVal;
  } else if(isSell){
    sl=resistances[0]?Math.min(resistances[0], price+2*atrVal):price+2*atrVal;
    t1=supports[0]?Math.max(supports[0], price-2.5*atrVal):price-2.5*atrVal;
    t2=supports[1]?Math.max(supports[1], price-5*atrVal):price-5*atrVal;
  } else {
    sl=price-2*atrVal;
    t1=price+2*atrVal;
    t2=price+4*atrVal;
  }

  const rr=Math.abs(t1-entry)/Math.abs(entry-sl);

  // Analysis paragraph
  const trend=bull>bear?'bullish':bear>bull?'bearish':'neutral';
  
  return {signals, rec, recClass, recScore, entry, sl, t1, t2, rr, atrVal, bull, bear, total};
}

// ── FORMAT ─────────────────────────────────────────────────────────────────
const fP=v=>v==null?'—':'₹'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fPct=(v,ref)=>v==null?'—':(((v-ref)/ref)*100>=0?'+':'')+(((v-ref)/ref)*100).toFixed(2)+'%';
const fV=v=>{if(!v&&v!==0)return'—';if(v>=1e7)return(v/1e7).toFixed(2)+' Cr';if(v>=1e5)return(v/1e5).toFixed(2)+' L';if(v>=1000)return(v/1000).toFixed(1)+'K';return String(v);};
const fMC=v=>{if(!v)return'—';if(v>=1e12)return'₹'+(v/1e12).toFixed(2)+' L Cr';if(v>=1e9)return'₹'+(v/1e9).toFixed(2)+' B';return'₹'+(v/1e6).toFixed(0)+' M';};

function generateAnalysisText(q, hist, ind, analysis) {
  const {rec,bull,bear,signals}=analysis;
  const n=hist.c.length-1;
  const price=hist.c[n];
  const rv=ind.rsiArr[n];
  const e20v=ind.e20[n], e50v=ind.e50[n], e200v=ind.e200[n];
  const macdBull=ind.macdObj.ml[n]>ind.macdObj.sl[n];

  const trend=price>e50v?'uptrend':'downtrend';
  const emaPos=e200v?(price>e200v?'above':'below'):null;
  const rsiDesc=rv<30?'oversold (RSI below 30)':rv>70?'overbought (RSI above 70)':`neutral (RSI ${rv?.toFixed(0)})`;
  const macdDesc=macdBull?'bullish MACD crossover':'bearish MACD reading';

  return `<strong>${q.shortName||q.symbol}</strong> is currently in a <strong>${trend}</strong>${emaPos?`, trading <strong>${emaPos} its 200-day EMA</strong>`:''}. The stock is <strong>${rsiDesc}</strong> with a <strong>${macdDesc}</strong>. Based on ${bull} bullish and ${bear} bearish signals across 5 indicators, the overall recommendation is <strong style="color:${rec.includes('BUY')?'var(--green)':rec.includes('SELL')?'var(--red)':'var(--amber)'}">${rec}</strong>. Price targets are calculated using Average True Range (ATR) and historical pivot levels. The stop-loss is placed at a 2×ATR distance to account for normal price volatility.`;
}

// ── CHART ──────────────────────────────────────────────────────────────────
function drawChart(hist, ind) {
  const canvas=document.getElementById('mainChart');
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth;
  const H=320;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const cs=getComputedStyle(document.documentElement);
  const COL={
    bg:'transparent', grid:'rgba(255,255,255,0.04)',
    price:'#7c4dff', e20:'#ffab40', e50:'#448aff', e200:'#ff5252',
    bbu:'rgba(100,200,255,0.4)', bbl:'rgba(100,200,255,0.4)', bbfill:'rgba(100,200,255,0.04)',
    up:'#00e676', dn:'#ff5252', vol:'rgba(124,77,255,0.3)',
    text:'rgba(136,136,170,1)'
  };

  const PL=8,PR=8,PT=16,PB=36;
  const CW=W-PL-PR, CH=H-PT-PB;
  const c=hist.c, ts=hist.ts;
  const N=c.length;

  const allVals=[...c];
  if(S.showEMA){ind.e20.filter(v=>v).forEach(v=>allVals.push(v));ind.e50.filter(v=>v).forEach(v=>allVals.push(v));ind.e200.filter(v=>v).forEach(v=>allVals.push(v));}
  if(S.showBB){ind.bbObj.u.filter(v=>v).forEach(v=>allVals.push(v));ind.bbObj.lo.filter(v=>v).forEach(v=>allVals.push(v));}
  const mn=Math.min(...allVals)*0.995, mx=Math.max(...allVals)*1.005;

  const xc=i=>PL+i/(N-1)*CW;
  const yp=v=>PT+(1-(v-mn)/(mx-mn))*CH;

  // Grid
  ctx.strokeStyle=COL.grid; ctx.lineWidth=1;
  for(let i=1;i<5;i++){const y=PT+i/5*CH;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(PL+CW,y);ctx.stroke();}
  for(let i=1;i<6;i++){const x=PL+i/6*CW;ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+CH);ctx.stroke();}

  // Price labels
  ctx.fillStyle=COL.text; ctx.font=`${10*dpr/dpr}px JetBrains Mono`; ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const v=mn+(mx-mn)*(1-i/4);
    ctx.fillText('₹'+v.toFixed(0),PL+CW-2,PT+i/4*CH+4);
  }

  // BB fill
  if(S.showBB&&ind.bbObj.u[N-1]){
    ctx.beginPath(); let st=false;
    for(let i=0;i<N;i++){if(ind.bbObj.u[i]==null)continue;if(!st){ctx.moveTo(xc(i),yp(ind.bbObj.u[i]));st=true;}else ctx.lineTo(xc(i),yp(ind.bbObj.u[i]));}
    for(let i=N-1;i>=0;i--){if(ind.bbObj.lo[i]==null)continue;ctx.lineTo(xc(i),yp(ind.bbObj.lo[i]));}
    ctx.closePath(); ctx.fillStyle=COL.bbfill; ctx.fill();
    for(const arr of [ind.bbObj.u,ind.bbObj.lo]){
      ctx.beginPath(); st=false;
      for(let i=0;i<N;i++){if(arr[i]==null)continue;if(!st){ctx.moveTo(xc(i),yp(arr[i]));st=true;}else ctx.lineTo(xc(i),yp(arr[i]));}
      ctx.strokeStyle=COL.bbu; ctx.lineWidth=1; ctx.stroke();
    }
  }

  // EMAs
  if(S.showEMA){
    for(const [arr,col,lw] of [[ind.e20,COL.e20,1.2],[ind.e50,COL.e50,1.2],[ind.e200,COL.e200,1.5]]){
      ctx.beginPath(); let st=false;
      for(let i=0;i<N;i++){if(arr[i]==null)continue;if(!st){ctx.moveTo(xc(i),yp(arr[i]));st=true;}else ctx.lineTo(xc(i),yp(arr[i]));}
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke();
    }
  }

  // Price gradient fill
  const grad=ctx.createLinearGradient(0,PT,0,PT+CH);
  grad.addColorStop(0,'rgba(124,77,255,0.25)'); grad.addColorStop(1,'rgba(124,77,255,0)');
  ctx.beginPath(); let st=false,fx=0;
  for(let i=0;i<N;i++){if(!st){ctx.moveTo(xc(i),yp(c[i]));fx=xc(i);st=true;}else ctx.lineTo(xc(i),yp(c[i]));}
  ctx.lineTo(xc(N-1),PT+CH); ctx.lineTo(fx,PT+CH); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // Price line
  ctx.beginPath(); st=false;
  for(let i=0;i<N;i++){if(!st){ctx.moveTo(xc(i),yp(c[i]));st=true;}else ctx.lineTo(xc(i),yp(c[i]));}
  ctx.strokeStyle=COL.price; ctx.lineWidth=2; ctx.stroke();

  // Date labels
  ctx.fillStyle=COL.text; ctx.textAlign='center'; ctx.font=`${10}px JetBrains Mono`;
  const step=Math.max(1,Math.floor(N/6));
  for(let i=0;i<N;i+=step){
    const d=new Date(ts[i]*1000);
    ctx.fillText(d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),xc(i),H-10);
  }

  // Hover
  function showTooltip(clientX, clientY, canvasX) {
    const i=Math.max(0,Math.min(N-1,Math.round((canvasX-PL)/CW*(N-1))));
    const d=new Date(ts[i]*1000);
    const tt=document.getElementById('tooltip');
    tt.style.display='block';
    // keep tooltip on screen
    const tLeft=Math.min(clientX+14, window.innerWidth-170);
    const tTop=Math.max(clientY-60, 10);
    tt.style.left=tLeft+'px';
    tt.style.top=tTop+'px';
    let rows=`<div class="tt-date">${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
      <div class="tt-row"><span class="tt-lbl">Close</span><span class="tt-val">${fP(c[i])}</span></div>
      <div class="tt-row"><span class="tt-lbl">High</span><span class="tt-val up">${fP(hist.h[i])}</span></div>
      <div class="tt-row"><span class="tt-lbl">Low</span><span class="tt-val down">${fP(hist.l[i])}</span></div>
      <div class="tt-row"><span class="tt-lbl">Volume</span><span class="tt-val">${fV(hist.v[i])}</span></div>`;
    if(ind.rsiArr[i]) rows+=`<div class="tt-row"><span class="tt-lbl">RSI</span><span class="tt-val">${ind.rsiArr[i].toFixed(1)}</span></div>`;
    tt.innerHTML=rows;
  }
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    showTooltip(e.clientX, e.clientY, e.clientX-rect.left);
  };
  canvas.onmouseleave=()=>{document.getElementById('tooltip').style.display='none';};
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const t=e.touches[0];
    showTooltip(t.clientX, t.clientY, t.clientX-rect.left);
  },{passive:false});
  canvas.addEventListener('touchend',()=>{
    setTimeout(()=>{document.getElementById('tooltip').style.display='none';},1200);
  });
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
async function loadStock(sym) {
  document.getElementById('main').innerHTML=`<div class="loading-state"><div class="spin"></div>Analysing ${sym}…</div>`;
  S.sym=sym;
  document.querySelectorAll('.qs').forEach(b=>b.classList.toggle('active',b.dataset.s===sym));
  try {
    const [hist, q] = await Promise.all([getHist(sym, S.range), getQuote(sym)]);
    const ind = calcAll(hist);
    const analysis = analyse(hist, ind);
    S.hist=hist; S.ind=ind;
    renderStock(q, hist, ind, analysis);
  } catch(e) {
    document.getElementById('main').innerHTML=`<div class="err-card">❌ ${e.message}</div>`;
  }
}

function doSearch() {
  let v=document.getElementById('searchInput').value.trim().toUpperCase();
  if(!v) return;
  if(!v.includes('.')&&!v.startsWith('^')) v+='.NS';
  loadStock(v);
}

function changeRange(r) {
  S.range=r;
  if(S.sym) loadStock(S.sym);
}
function toggleEMA(){S.showEMA=!S.showEMA;if(S.hist)drawChart(S.hist,S.ind);}
function toggleBB(){S.showBB=!S.showBB;if(S.hist)drawChart(S.hist,S.ind);}

// ── STRIP ────────────────────────────────────────────────────────────────────
async function loadStrip() {
  const el=document.getElementById('strip');
  const results=await Promise.allSettled(INDICES.map(x=>getQuote(x.s)));
  let html='';
  results.forEach((res,i)=>{
    if(res.status==='fulfilled'){
      const q=res.value; const up=q.change>=0;
      html+=`<div class="si">
        <span class="si-name">${INDICES[i].l}</span>
        <span class="si-price">${q.price?.toFixed(2)||'—'}</span>
        <span class="si-chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(q.changePct).toFixed(2)}%</span>
      </div>`;
    }
  });
  el.innerHTML=html||'<div class="si"><span class="si-name" style="color:var(--red)">Indices unavailable</span></div>';
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  // Desktop header quick stocks
  const qs=document.getElementById('quickStocks');
  // Mobile/tablet strip
  const qsStrip=document.getElementById('qsStrip');
  STOCKS.forEach(({l,s})=>{
    [qs, qsStrip].forEach(container=>{
      const b=document.createElement('button');
      b.className='qs'; b.textContent=l; b.dataset.s=s;
      b.onclick=()=>{document.getElementById('searchInput').value=l; loadStock(s);};
      container.appendChild(b);
    });
  });
  loadStrip();
  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{if(S.hist&&S.ind)drawChart(S.hist,S.ind);},100);
  });
}
init();
</script>
